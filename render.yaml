services:
  - type: web
    name: learning-mentor-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py seed_curriculum"
    startCommand: "gunicorn config.wsgi:application"
    plan: free
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "learning-mentor-api.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://learning-mentor-api.onrender.com"
      - key: MAX_DAILY_SUBMISSIONS
        value: "10"
      - key: GEMINI_MODEL
        value: "gemini-1.5-flash"
      # নিচের দুটো Render dashboard-এ নিজে দিতে হবে (secret)
      # DATABASE_URL
      # SECRET_KEY
      # GEMINI_API_KEY
